<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiction Vocabulary Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #fafafa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Top Navigation */
        .nav-bar {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 1rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            padding: 0.5rem 0;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-btn.active {
            color: #000;
            border-bottom: 2px solid #000;
            padding-bottom: calc(0.5rem - 2px);
        }

        .nav-btn:hover:not(.active) {
            color: #666;
        }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        .left-column {
            min-width: 0;
        }

        .right-column {
            min-width: 0;
        }

        /* Search Section */
        .search-section {
            margin-bottom: 2rem;
        }

        .search-wrapper {
            display: flex;
            gap: 0.75rem;
        }

        .search-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #333;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        .btn-search {
            padding: 0.75rem 1.5rem;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-search:hover {
            background-color: #222;
        }

        .search-hint {
            font-size: 0.85rem;
            color: #999;
            margin-top: 0.5rem;
        }

        /* Word Header */
        .word-header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 2rem;
        }

        .word-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .word-category {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 1rem;
        }

        .word-stats {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
            color: #666;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-label {
            color: #999;
        }

        /* Word Definition Box */
        .definition-box {
            background-color: #f5f5f5;
            border-left: 3px solid #000;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border-radius: 2px;
        }

        .definition-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .definition-text {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.8;
        }

        /* Context Section */
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #000;
            margin: 2rem 0 1rem 0;
        }

        .context-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .context-item {
            background-color: #fff;
            border: 1px solid #e5e5e5;
            padding: 1rem;
            border-radius: 4px;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .context-item.highlight {
            background-color: #fffbf0;
            border-color: #f0e5d8;
        }

        .highlight-text {
            background-color: #fff3cd;
            padding: 2px 4px;
            font-weight: 600;
            border-radius: 2px;
        }

        .context-source {
            font-size: 0.8rem;
            color: #999;
            margin-top: 0.5rem;
        }

        /* Alternatives Section */
        .alternatives-section {
            margin: 2rem 0;
        }

        .alt-category {
            margin-bottom: 2.5rem;
        }

        .alt-category-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alt-count {
            background-color: #e5e5e5;
            padding: 0.2rem 0.5rem;
            border-radius: 2px;
            font-size: 0.75rem;
            color: #666;
        }

        .alt-card {
            background-color: #fff;
            border: 1px solid #e5e5e5;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .alt-card:hover {
            border-color: #999;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .alt-word {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: capitalize;
        }

        .alt-word-meta {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 1rem;
        }

        .alt-definition {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .alt-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .alt-detail-item {
            border-top: 1px solid #f0f0f0;
            padding-top: 0.75rem;
        }

        .alt-detail-label {
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-size: 0.75rem;
            margin-bottom: 0.3rem;
        }

        .alt-detail-value {
            color: #333;
        }

        .alt-example {
            background-color: #f9f9f9;
            border-left: 2px solid #999;
            padding: 0.75rem;
            font-size: 0.9rem;
            font-style: italic;
            color: #555;
            margin-top: 1rem;
        }

        .alt-usage {
            background-color: #f0f8ff;
            border-left: 3px solid #4a90e2;
            padding: 0.75rem;
            font-size: 0.9rem;
            color: #333;
            margin-top: 1rem;
        }

        .alt-usage-label {
            font-weight: 600;
            color: #4a90e2;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.03em;
            margin-bottom: 0.3rem;
        }

        /* Right Sidebar */
        .sidebar-card {
            background-color: #fff;
            border: 1px solid #e5e5e5;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
        }

        .sidebar-title {
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            color: #000;
        }

        .corpus-info {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.8;
        }

        .corpus-stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .corpus-stat-label {
            color: #999;
        }

        .corpus-stat-value {
            font-weight: 600;
            color: #000;
        }

        .upload-section {
            padding: 1.5rem;
            border: 2px dashed #ddd;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-section:hover {
            border-color: #999;
            background-color: #f9f9f9;
        }

        .upload-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #000;
            cursor: pointer;
        }

        .upload-hint {
            font-size: 0.8rem;
            color: #999;
        }

        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .file-item {
            padding: 0.35rem 0;
            color: #666;
            word-break: break-word;
        }

        .btn-clear {
            width: 100%;
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-clear:hover {
            background-color: #eee;
            border-color: #999;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #999;
        }

        .empty-state-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #666;
        }

        .empty-state-text {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .right-column {
                order: -1;
            }

            .word-title {
                font-size: 1.8rem;
            }

            .alt-details {
                grid-template-columns: 1fr;
            }

            .word-stats {
                flex-direction: column;
                gap: 0.75rem;
            }

            .nav-bar {
                gap: 1rem;
            }

            .nav-btn {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }

            .word-title {
                font-size: 1.4rem;
            }

            .search-wrapper {
                flex-direction: column;
            }

            .section-title {
                font-size: 0.85rem;
            }

            .alt-card {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <div class="nav-bar">
            <button class="nav-btn active" data-mode="VERBS">VERBS</button>
            <button class="nav-btn" data-mode="ADVERBS">ADVERBS</button>
            <button class="nav-btn" data-mode="ADJECTIVES">ADJECTIVES</button>
            <button class="nav-btn" id="browse-btn">BROWSE</button>
        </div>

        <div class="main-content">
            <div class="left-column">
                <!-- Search -->
                <div class="search-section">
                    <div class="search-wrapper">
                        <input 
                            type="text" 
                            class="search-input" 
                            id="search-input" 
                            placeholder="Enter a verb, or a whole sentence such as &quot;She looked at him.&quot;"
                        >
                        <button class="btn-search" id="search-btn">Search</button>
                    </div>
                    <div class="search-hint" id="search-hint"></div>
                </div>

                <!-- Results Container -->
                <div id="results-container"></div>

                <!-- Empty State -->
                <div class="empty-state" id="empty-state">
                    <div class="empty-state-title">Upload books to get started</div>
                    <div class="empty-state-text">Add PDF files using the upload panel on the right to extract vocabulary from your own fiction.</div>
                </div>
            </div>

            <div class="right-column">
                <!-- Upload Section -->
                <div class="sidebar-card">
                    <div class="sidebar-title">Your Corpus</div>
                    <div class="upload-section" id="upload-area">
                        <label class="upload-label" for="pdf-files">📖 Upload PDFs</label>
                        <div class="upload-hint">Up to 10 files • PDF format</div>
                        <input type="file" id="pdf-files" multiple accept=".pdf">
                    </div>
                    <div class="file-list" id="file-list"></div>
                    <button class="btn-clear" id="clear-books">Clear Books</button>
                </div>

                <!-- Corpus Stats -->
                <div class="sidebar-card">
                    <div class="sidebar-title">Statistics</div>
                    <div class="corpus-info">
                        <div class="corpus-stat">
                            <span class="corpus-stat-label">Unique Words</span>
                            <span class="corpus-stat-value" id="unique-count">0</span>
                        </div>
                        <div class="corpus-stat">
                            <span class="corpus-stat-label">Total Words</span>
                            <span class="corpus-stat-value" id="total-count">0</span>
                        </div>
                        <div class="corpus-stat">
                            <span class="corpus-stat-label">PDF Files</span>
                            <span class="corpus-stat-value" id="files-count">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        // Set worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // Comprehensive Word Data with Nuances

                },

                look: {

                                frequency: 12,
                                nuance: 'fleeting, often furtive',

            // ADVERBS
            ADVERBS: {
                quietly: {
                    definition: 'in a quiet manner; with little noise',
                    category: 'Manner › Volume › Soft',
                    frequency: 18,
                    alternatives: {
                        'Soft': [

            // ADJECTIVES
            ADJECTIVES: {
                beautiful: {
                    definition: 'pleasing to the senses or mind',
                    category: 'Appearance › Aesthetic › Attractive',
                    frequency: 8,
                    alternatives: {
                        'Classic': [

        // State
        let state = {
            corpus: {},
            rawText: '',
            files: [],
            currentMode: 'VERBS',
            totalWords: 0
        };

        // DOM Elements
        const navBtns = document.querySelectorAll('.nav-btn');
        const pdfInput = document.getElementById('pdf-files');
        const uploadArea = document.getElementById('upload-area');
        const fileList = document.getElementById('file-list');
        const clearBooksBtn = document.getElementById('clear-books');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultsContainer = document.getElementById('results-container');
        const emptyState = document.getElementById('empty-state');
        const uniqueCount = document.getElementById('unique-count');
        const totalCount = document.getElementById('total-count');
        const filesCount = document.getElementById('files-count');
        const browseBtn = document.getElementById('browse-btn');

        // Event Listeners
        navBtns.forEach(btn => btn.addEventListener('click', handleModeChange));
        pdfInput.addEventListener('change', handleFileSelection);
        uploadArea.addEventListener('click', () => pdfInput.click());
        clearBooksBtn.addEventListener('click', clearCorpus);
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
        browseBtn.addEventListener('click', browseSuggestions);

        // Mode Change
        function handleModeChange(e) {
            navBtns.forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            state.currentMode = e.target.dataset.mode || e.target.textContent;
            
            const hints = {
                VERBS: 'Enter a verb, or a whole sentence such as "She looked at him."',
                ADVERBS: 'Enter an adverb or verb to find adverbial alternatives…',
                ADJECTIVES: 'Enter an adjective or noun to find descriptive alternatives…',
                BROWSE: 'Browse all available word options'
            };
            document.getElementById('search-hint').textContent = hints[state.currentMode] || '';
            searchInput.placeholder = hints[state.currentMode] || '';
            
            if (state.currentMode !== 'BROWSE') {
                searchInput.focus();
            }
        }

        // File Selection
        async function handleFileSelection(e) {
            const files = Array.from(e.target.files).slice(0, 10);
            state.files = files;

            if (files.length === 0) return;

            const hint = document.getElementById('search-hint');
            hint.innerHTML = '<span class="loading-spinner"></span>Processing PDFs...';

            try {
                await extractTextFromPDFs(files);
                buildCorpus();
                updateUI();
                hint.textContent = '';
            } catch (error) {
                console.error('Error processing PDFs:', error);
                hint.textContent = 'Error processing files';
            }
        }

        // Extract Text from PDFs
        async function extractTextFromPDFs(files) {
            let allText = '';
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    allText += ' ' + pageText;
                }
            }
            state.rawText = allText.toLowerCase();
        }

        // Build Corpus
        function buildCorpus() {
            const words = state.rawText.match(/[a-z'-]+/g) || [];
            state.totalWords = words.length;
            const corpus = {};

            words.forEach(word => {
                corpus[word] = (corpus[word] || 0) + 1;
            });

            state.corpus = corpus;
        }

        // Update UI
        function updateUI() {
            filesCount.textContent = state.files.length;
            uniqueCount.textContent = Object.keys(state.corpus).length.toLocaleString();
            totalCount.textContent = state.totalWords.toLocaleString();
            
            fileList.innerHTML = state.files.map(f => 
                `<div class="file-item">✓ ${f.name.slice(0, 35)}${f.name.length > 35 ? '...' : ''}</div>`
            ).join('');

            emptyState.style.display = 'none';
        }

        // Clear Corpus
        function clearCorpus() {
            state.corpus = {};
            state.rawText = '';
            state.files = [];
            state.totalWords = 0;
            pdfInput.value = '';
            fileList.innerHTML = '';
            filesCount.textContent = '0';
            uniqueCount.textContent = '0';
            totalCount.textContent = '0';
            resultsContainer.innerHTML = '';
            emptyState.style.display = 'block';
        }

        // Perform Search
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) return;

            const wordData = WORD_DATA[state.currentMode];
            const word = query.split(/\s+/)[0];
            const data = wordData[word];

            if (!data) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-title">Word not in database</div>
                        <div class="empty-state-text">Try searching for: grin, walk, look, quietly, or beautiful</div>
                    </div>
                `;
                return;
            }

            renderWordResult(word, data);
        }

        // Render Word Result
        function renderWordResult(word, data) {
            let contextHTML = '';
            
            // Find contexts in corpus
            if (Object.keys(state.corpus).length > 0) {
                const regex = new RegExp(`[^.!?]*\\b${word}\\b[^.!?]*[.!?]`, 'gi');
                const matches = (state.rawText.match(regex) || []).slice(0, 3);
                
                if (matches.length > 0) {
                    contextHTML = `
                        <div class="section-title">From your books</div>
                        <div style="font-size: 0.9rem; color: #999; margin-bottom: 1rem;">${state.corpus[word] || 0} occurrences</div>
                        <div class="context-list">
                            ${matches.map(m => `
                                <div class="context-item highlight">
                                    ${m.replace(new RegExp(`\\b(${word})\\b`, 'gi'), '<span class="highlight-text">$1</span>')}
                                    <div class="context-source">The Describer's Dictionary — Your Books</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            }

            const alternativesHTML = Object.entries(data.alternatives)
                .map(([category, words]) => `
                    <div class="alt-category">
                        <div class="alt-category-title">
                            ${category}
                            <span class="alt-count">${words.length}</span>
                        </div>
                        ${words.map(w => renderAltCard(w)).join('')}
                    </div>
                `).join('');

            const wordFrequency = state.corpus[word] || data.frequency;
            const usagePerCapita = ((wordFrequency / Math.max(state.totalWords, 10000)) * 10000).toFixed(1);

            resultsContainer.innerHTML = `
                <div class="word-header">
                    <div class="word-title">${word}</div>
                    <div class="word-category">${data.category}</div>
                    <div class="word-stats">
                        <div class="stat-item">
                            <span class="stat-label">Occurrences:</span>
                            <span>${wordFrequency}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Frequency:</span>
                            <span>${usagePerCapita} per 10k words</span>
                        </div>
                    </div>
                </div>

                ${contextHTML}

                <div class="alternatives-section">
                    <h3 class="section-title">Stronger Alternatives</h3>
                    ${alternativesHTML}
                </div>
            `;
        }

        // Render Alternative Card
        function renderAltCard(wordInfo) {
            const frequency = state.corpus[wordInfo.word] || wordInfo.frequency;
            
            return `
                <div class="alt-card">
                    <div class="alt-word">${wordInfo.word}</div>
                    <div class="alt-word-meta">
                        ${Object.keys(state.corpus).length > 0 ? `in your books · ${frequency}` : `typical · ${frequency} occurrences`}
                    </div>
                    <div class="alt-definition">${wordInfo.definition}</div>
                    
                    <div class="alt-details">
                        <div class="alt-detail-item">
                            <div class="alt-detail-label">Nuance</div>
                            <div class="alt-detail-value">${wordInfo.nuance}</div>
                        </div>
                        <div class="alt-detail-item">
                            <div class="alt-detail-label">Emotion</div>
                            <div class="alt-detail-value">${wordInfo.emotion}</div>
                        </div>
                    </div>

                    <div class="alt-example">"${wordInfo.example}"</div>
                    
                    <div class="alt-usage">
                        <div class="alt-usage-label">Use it</div>
                        ${wordInfo.usage}
                    </div>

                    ${wordInfo.note ? `<div style="background-color: #fff3cd; border-left: 3px solid #e6b800; padding: 0.75rem; font-size: 0.9rem; color: #333; margin-top: 1rem; border-radius: 2px;"><strong>As a replacement:</strong> ${wordInfo.note}</div>` : ''}
                </div>
            `;
        }

        // Browse Suggestions
        function browseSuggestions() {
            const modeData = WORD_DATA[state.currentMode === 'BROWSE' ? 'VERBS' : state.currentMode];
            const browseBrowseContent = Object.entries(modeData)
                .map(([word, data]) => `
                    <div style="margin-bottom: 1.5rem; cursor: pointer;" onclick="searchWord('${word}')">
                        <div class="word-title" style="font-size: 1.4rem; margin-bottom: 0.5rem;">${word}</div>
                        <div class="word-category">${data.category}</div>
                    </div>
                `).join('');

            resultsContainer.innerHTML = `
                <h2 class="section-title" style="margin-top: 0;">Browse ${state.currentMode}</h2>
                ${browseBrowseContent}
            `;
        }

        // Search word from browse
        window.searchWord = function(word) {
            searchInput.value = word;
            performSearch();
        };

        // Initialize
        emptyState.style.display = 'block';
    </script>
</body>
</html>
